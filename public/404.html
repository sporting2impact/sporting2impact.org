<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sporting2Impact</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // This redirects any unmatched path (e.g. a direct link or refresh on
    // /team, /events, /joinus) back to index.html with the original path
    // encoded in the query string, so Angular's router can restore it.
    var pathSegmentsToKeep = 0; // custom domain served from the root, not a /repo-name subpath
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
